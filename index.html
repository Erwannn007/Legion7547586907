<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Légion Pixel">
<meta name="theme-color" content="#1a1020">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Légion Pixel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <section id="s-menu" class="screen on">
    <canvas id="scene"></canvas>
    <div class="topbar">
      <div class="chip pn" data-ic="coin"><span class="goldv">0</span></div>
      <div style="flex:1"></div>
      <button class="pb sq" id="b-help" aria-label="Aide" data-ic="help"></button>
      <button class="pb sq" id="b-set" aria-label="Réglages" data-ic="gear"></button>
    </div>
    <div class="title-wrap">
      <canvas id="title"></canvas>
      <div class="tagline pp">Recrutez, déployez, conquérez.</div>
    </div>
    <div class="menu-btns" id="menu-btns">
      <button class="pb big brass" data-go="story" data-ic="swords">Campagne</button>
      <button class="pb big" data-go="sandbox" data-ic="flag">Bac à sable</button>
      <div class="row">
        <button class="pb" data-go="army" data-ic="shield">Armée</button>
        <button class="pb" data-go="shop" data-ic="chest">Coffres</button>
      </div>
      <div id="install-hint" class="hint pp hidden">Pour installer : Partager, puis « Sur l’écran d’accueil ».</div>
    </div>
  </section>

  <section id="s-story" class="screen">
    <div class="topbar">
      <button class="pb sq" data-go="menu" aria-label="Retour" data-ic="back"></button>
      <h2>Campagne</h2>
      <div class="chip pn" data-ic="coin"><span class="goldv">0</span></div>
    </div>
    <div class="scroll" id="story-list"></div>
  </section>

  <section id="s-army" class="screen">
    <div class="topbar">
      <button class="pb sq" data-go="menu" aria-label="Retour" data-ic="back"></button>
      <h2>Armée</h2>
      <div class="chip pn" data-ic="coin"><span class="goldv">0</span></div>
    </div>
    <div class="scroll"><div id="army-grid" class="grid2"></div></div>
  </section>

  <section id="s-shop" class="screen">
    <div class="topbar">
      <button class="pb sq" data-go="menu" aria-label="Retour" data-ic="back"></button>
      <h2>Coffres</h2>
      <div class="chip pn" data-ic="coin"><span class="goldv">0</span></div>
    </div>
    <div class="scroll" id="shop-list"></div>
  </section>

  <section id="s-battle" class="screen">
    <div class="bhud pn2">
      <button class="pb sq" id="b-quit" aria-label="Quitter" data-ic="close"></button>
      <div class="bt"><div id="b-title"></div><div id="b-sub"></div></div>
      <div class="cnt pr" id="cnt-r">0</div><div class="cnt pbl" id="cnt-b">0</div>
    </div>
    <div id="cwrap"><canvas id="cv"></canvas><div id="toast" class="pp"></div></div>
    <div class="bpanel pn2" id="bpanel"></div>
  </section>

  <div id="modal" class="modal hidden"><div class="mbox pp" id="mbox"></div></div>
</div>
<script src="js/art.js"></script>
<script src="js/core.js"></script>
<script src="js/battle.js"></script>
<script src="js/modes.js"></script>
<script src="js/meta.js"></script>
</body>
</html>
